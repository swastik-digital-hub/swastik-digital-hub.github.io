<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET Portal | Swastik-Tech</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #03151c;
            --card-bg: rgba(6, 32, 43, 0.85);
            --card-border: #0e3746;
            --accent-cyan: #00f3ff;
            --accent-blue: #00b4d8;
            --text-main: #ffffff;
            --text-muted: #83c5be;
            --border-glow: rgba(0, 243, 255, 0.25);
            --header-bg: rgba(3, 21, 28, 0.85);
            --grid-color: rgba(0, 243, 255, 0.04);
            --input-bg: rgba(0, 243, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 180, 216, 0.12) 0%, transparent 70%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 60px;
            padding: 0 2rem;
            background: var(--header-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
            padding-left: 10px;
            letter-spacing: 1px;
        }

        .back-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
        }

        .back-btn:hover {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .portal-container {
            padding: 2.5rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .section-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .resource-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.8rem;
            transition: all 0.3s ease;
        }

        .resource-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--border-glow);
            transform: translateY(-2px);
        }

        .resource-card-header {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 0.8rem;
        }

        .resource-card-icon {
            font-size: 1.8rem;
            color: var(--accent-cyan);
        }

        .resource-card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .resource-card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .action-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--accent-cyan);
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--border-glow);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">| NEET Medical Portal</div>
        <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </header>

    <main class="portal-container">
        <div class="section-tag">Study Resources</div>
        
        <!-- Reference Books Section linked to books.html -->
        <div class="resource-card">
            <div class="resource-card-header">
                <i class="fa-solid fa-book-bookmark resource-card-icon"></i>
                <div class="resource-card-title">Reference Books</div>
            </div>
            <p class="resource-card-desc">Access subject libraries for Physics, Chemistry, Botany, and Zoology reference materials and problem modules.</p>
            <a href="books.html" class="action-btn">Open Books Section <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </main>

</body>
</html>
