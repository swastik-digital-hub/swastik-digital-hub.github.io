<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | Swastik-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Self-Contained Browser Tab Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2300f3ff%22><path d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22/></svg>">

    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-cyan: #00f3ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.3);
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-cyan: #0284c7;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-glow: rgba(2, 132, 199, 0.3);
            --grid-color: rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, var(--border-glow) 0%, transparent 80%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 2rem;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 2rem;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
            padding-left: 10px;
        }

        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .back-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .profile-container {
            max-width: 500px;
            margin: 3rem auto;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 2.5rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .profile-container h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--accent-cyan);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(3, 15, 24, 0.6);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.1rem;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .save-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent-cyan);
            color: #080c14;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px var(--border-glow);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">| User Profile Settings</div>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </header>

    <div class="profile-container">
        <h2>Configure Your Profile</h2>
        <form id="profileForm">
            <div class="form-group">
                <label for="usernameInput">Your Name</label>
                <input type="text" id="usernameInput" placeholder="e.g. Swastik Sambhu Panda" required>
            </div>
            <button type="submit" class="save-btn"><i class="fa-solid fa-floppy-disk"></i> Save Profile</button>
        </form>
    </div>

    <script>
        // Theme persistence check
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        // Pre-fill the input field with the saved username when opening profile settings
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('userName');
            if (savedName) {
                document.getElementById('usernameInput').value = savedName;
            }
        });

        // Save username to localStorage and return to dashboard
        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nameValue = document.getElementById('usernameInput').value.trim();
            if (nameValue) {
                localStorage.setItem('userName', nameValue);
                alert('Profile saved successfully!');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
