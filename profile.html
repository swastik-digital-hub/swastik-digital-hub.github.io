<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile Settings | Swastik-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Self-Contained Browser Tab Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2300f3ff%22><path d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22/></svg>">

    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.95);
            --accent-cyan: #00f3ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.3);
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-cyan: #0284c7;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-glow: rgba(2, 132, 199, 0.3);
            --grid-color: rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, var(--border-glow) 0%, transparent 80%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 0.75rem;
            width: 100%;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 1rem;
            width: 100%;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
            padding-left: 6px;
        }

        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(8px);
        }

        .profile-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto 1.5rem auto;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 1rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
        }

        .profile-container h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 0.4rem;
        }

        .profile-header-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .profile-photo-box {
            width: 70px;
            height: 70px;
            border: 2px dashed var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1.4rem;
            background: rgba(0, 243, 255, 0.05);
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-label {
            display: inline-block;
            background: rgba(3, 15, 24, 0.6);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }

        @media (min-width: 600px) {
            .form-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            body { padding: 2rem; }
            .profile-container { padding: 2rem; }
        }

        .form-group {
            width: 100%;
        }

        .form-group label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            margin-bottom: 0.3rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100% !important;
            max-width: 100% !important;
            padding: 0.65rem 0.8rem;
            background: rgba(3, 15, 24, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--border-glow);
        }

        .section-heading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--accent-cyan);
            margin: 1rem 0 0.6rem 0;
            border-left: 3px solid var(--accent-cyan);
            padding-left: 6px;
        }

        .save-btn {
            margin-top: 1.2rem;
            width: 100%;
            padding: 0.8rem;
            background: var(--accent-cyan);
            color: #080c14;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px var(--border-glow);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">| User Profile Settings</div>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </header>

    <div class="profile-container">
        <h2>Student Profile Dashboard</h2>
        
        <form id="profileForm">
            <div class="profile-header-section">
                <div class="profile-photo-box" id="photoPreviewBox">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h3 style="font-family: 'Orbitron'; color: var(--accent-cyan); margin-bottom: 0.3rem; font-size: 0.9rem;">Profile Photo</h3>
                    <label for="photoInput" class="upload-label"><i class="fa-solid fa-upload"></i> Upload Photo</label>
                    <input type="file" id="photoInput" accept="image/*" style="display: none;">
                </div>
            </div>

            <div class="section-heading-text">Academic Details</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="dobInput">Date of Birth</label>
                    <input type="date" id="dobInput">
                </div>
                <div class="form-group">
                    <label for="genderInput">Gender</label>
                    <select id="genderInput">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="section-heading-text">School Information</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="sectionInput">Section / Class</label>
                    <input type="text" id="sectionInput" placeholder="e.g. Class 11 Science">
                </div>
                <div class="form-group">
                    <label for="rollInput">Roll Number</label>
                    <input type="text" id="rollInput" placeholder="e.g. 42">
                </div>
                <div class="form-group">
                    <label for="stateInput">State</label>
                    <input type="text" id="stateInput" placeholder="e.g. Odisha">
                </div>
                <div class="form-group">
                    <label for="cityInput">City</label>
                    <input type="text" id="cityInput" placeholder="e.g. Brahmapur">
                </div>
            </div>

            <div class="section-heading-text">Contact & Account Info</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="phoneInput">Phone Number</label>
                    <input type="tel" id="phoneInput" placeholder="e.g. +91 XXXXXXXXXX">
                </div>
                <div class="form-group">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" placeholder="e.g. name@domain.com">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="usernameInput">User Name</label>
                    <input type="text" id="usernameInput" placeholder="e.g. Swastik Sambhu Panda" required>
                </div>
            </div>

            <button type="submit" class="save-btn"><i class="fa-solid fa-floppy-disk"></i> Save Profile Details</button>
        </form>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        let uploadedImageBase64 = "";

        document.getElementById('photoInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('photoPreviewBox').innerHTML = `<img src="${uploadedImageBase64}" alt="Profile Photo">`;
                };
                reader.readAsDataURL(file);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('userName')) document.getElementById('usernameInput').value = localStorage.getItem('userName');
            if (localStorage.getItem('userDob')) document.getElementById('dobInput').value = localStorage.getItem('userDob');
            if (localStorage.getItem('userGender')) document.getElementById('genderInput').value = localStorage.getItem('userGender');
            if (localStorage.getItem('userSection')) document.getElementById('sectionInput').value = localStorage.getItem('userSection');
            if (localStorage.getItem('userRoll')) document.getElementById('rollInput').value = localStorage.getItem('userRoll');
            if (localStorage.getItem('userState')) document.getElementById('stateInput').value = localStorage.getItem('userState');
            if (localStorage.getItem('userCity')) document.getElementById('cityInput').value = localStorage.getItem('userCity');
            if (localStorage.getItem('userPhone')) document.getElementById('phoneInput').value = localStorage.getItem('userPhone');
            if (localStorage.getItem('userEmail')) document.getElementById('emailInput').value = localStorage.getItem('userEmail');
            
            const savedPhoto = localStorage.getItem('userPhoto');
            if (savedPhoto) {
                uploadedImageBase64 = savedPhoto;
                document.getElementById('photoPreviewBox').innerHTML = `<img src="${savedPhoto}" alt="Profile Photo">`;
            }
        });

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const nameValue = document.getElementById('usernameInput').value.trim();
            if (nameValue) {
                localStorage.setItem('userName', nameValue);
                localStorage.setItem('userDob', document.getElementById('dobInput').value);
                localStorage.setItem('userGender', document.getElementById('genderInput').value);
                localStorage.setItem('userSection', document.getElementById('sectionInput').value);
                localStorage.setItem('userRoll', document.getElementById('rollInput').value);
                localStorage.setItem('userState', document.getElementById('stateInput').value);
                localStorage.setItem('userCity', document.getElementById('cityInput').value);
                localStorage.setItem('userPhone', document.getElementById('phoneInput').value);
                localStorage.setItem('userEmail', document.getElementById('emailInput').value);
                
                if (uploadedImageBase64) {
                    localStorage.setItem('userPhoto', uploadedImageBase64);
                }

                alert('Profile details saved successfully!');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
