<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JEE Main Portal | Past Year Questions</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Self-Contained Browser Tab Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2300f3ff%22><path d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22/></svg>">

    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-cyan: #00f3ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.3);
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, var(--border-glow) 0%, transparent 80%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 1rem;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 1.5rem;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
            padding-left: 8px;
        }

        .dashboard-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .dashboard-btn:hover {
            background: var(--accent-cyan);
            color: #080c14;
            box-shadow: 0 0 10px var(--border-glow);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--accent-cyan);
            margin: 1.5rem 0 0.8rem 0;
            letter-spacing: 0.5px;
        }

        /* Table Design matching NEET portal */
        .table-container {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            overflow-x: auto;
            backdrop-filter: blur(8px);
            margin-bottom: 2rem;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 500px;
        }

        th {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0.9rem 1rem;
            border-bottom: 1px solid var(--border-glow);
            letter-spacing: 1px;
        }

        td {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .doc-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .doc-info i {
            color: #ff4757;
            font-size: 1.3rem;
        }

        .doc-title {
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pdf-badge {
            font-size: 0.65rem;
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .doc-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .type-badge {
            display: inline-block;
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
        }

        .action-btn {
            background: rgba(3, 15, 24, 0.6);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .action-btn:hover {
            background: var(--accent-cyan);
            color: #080c14;
            box-shadow: 0 0 10px var(--border-glow);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">| JEE Main Portal</div>
        <a href="../index.html" class="dashboard-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </header>

    <div class="section-title">Past Year Questions (Subject-wise PYQ Bank)</div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>DOCUMENT</th>
                    <th>TYPE</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <div class="doc-info">
                            <i class="fa-solid fa-file-pdf"></i>
                            <div>
                                <div class="doc-title">Physics PYQs <span class="pdf-badge">PDF</span></div>
                                <div class="doc-meta">Year: 2025</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="type-badge">PYQ Bank</span></td>
                    <td>
                        <!-- Replace '#' with your actual PDF link or file path -->
                        <a href="#" target="_blank" class="action-btn"><i class="fa-solid fa-download"></i> Download</a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="doc-info">
                            <i class="fa-solid fa-file-pdf"></i>
                            <div>
                                <div class="doc-title">Chemistry PYQs <span class="pdf-badge">PDF</span></div>
                                <div class="doc-meta">Year: 2025</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="type-badge">PYQ Bank</span></td>
                    <td>
                        <!-- Replace '#' with your actual PDF link or file path -->
                        <a href="#" target="_blank" class="action-btn"><i class="fa-solid fa-download"></i> Download</a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="doc-info">
                            <i class="fa-solid fa-file-pdf"></i>
                            <div>
                                <div class="doc-title">Mathematics PYQs <span class="pdf-badge">PDF</span></div>
                                <div class="doc-meta">Year: 2025</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="type-badge">PYQ Bank</span></td>
                    <td>
                        <!-- Replace '#' with your actual PDF link or file path -->
                        <a href="#" target="_blank" class="action-btn"><i class="fa-solid fa-download"></i> Download</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
