<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Suite | Swastik-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-cyan: #00f3ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.3);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-cyan: #0284c7;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-glow: rgba(2, 132, 199, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 2rem;
        }

        .title { font-family: 'Orbitron', sans-serif; color: var(--accent-cyan); font-size: 1.5rem; }
        .back-link { color: var(--accent-cyan); text-decoration: none; font-family: 'Orbitron', sans-serif; }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.8rem 1rem;
            margin-top: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            transition: 0.3s;
        }

        .option-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
    </style>
</head>
<body>

    <header>
        <div class="title" id="practiceTitle">Practice Module</div>
        <a href="mains-hub.html" class="back-link">&larr; Back to Hub</a>
    </header>

    <main id="practiceContainer"></main>

    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        const params = new URLSearchParams(window.location.search);
        const setNo = params.get('set');
        const subject = params.get('sub');
        const classVal = params.get('class');

        let titleText = "Practice Module";
        if (setNo) titleText = `Practice Set ${setNo}`;
        if (subject) titleText = `Class ${classVal} ${subject.toUpperCase()} Practice`;
        document.getElementById('practiceTitle').textContent = titleText;

        const practiceQuestions = [
            { id: 1, q: "Which logic gate outputs 1 only when all inputs are 1?", options: ["OR Gate", "AND Gate", "NOT Gate", "NAND Gate"], correct: 1 },
            { id: 2, q: "What is the SI unit of electric potential difference?", options: ["Ampere", "Ohm", "Volt", "Watt"], correct: 2 }
        ];

        const container = document.getElementById('practiceContainer');
        practiceQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem;">Q${idx + 1}. ${q.q}</div>
                <div>
                    ${q.options.map((opt, oIdx) => `
                        <button class="option-btn" onclick="checkAnswer(this, ${oIdx === q.correct})">${opt}</button>
                    `).join('')}
                </div>
            `;
            container.appendChild(card);
        });

        function checkAnswer(button, isCorrect) {
            const parent = button.parentElement;
            const buttons = parent.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                button.classList.add('correct');
            } else {
                button.classList.add('wrong');
            }
        }
    </script>
</body>
</html>
