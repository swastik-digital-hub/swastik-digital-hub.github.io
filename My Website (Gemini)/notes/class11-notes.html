<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 11 Notes Hub | Swastik-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-cyan: #00f3ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.3);
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-cyan: #0284c7;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-glow: rgba(2, 132, 199, 0.3);
            --grid-color: rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, var(--border-glow) 0%, transparent 80%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 2rem;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 2rem;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--accent-cyan);
            text-decoration: none;
        }

        .logo-img { height: 45px; width: auto; }

        .back-nav {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .back-nav:hover { opacity: 0.8; }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            margin: 2rem 0 1rem 0;
            border-left: 4px solid var(--accent-cyan);
            padding-left: 0.8rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .folder-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .folder-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--border-glow);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <a href="../index.html" class="brand-title">Swastik-Tech</a>
            <img src="../assets/logo.png" alt="Swastik-Tech Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/120x40?text=Swastik-Tech'">
        </div>
        <a href="../class11/class11-hub.html" class="back-nav">&larr; Back to Class 11 Portal</a>
    </header>

    <h2 class="section-title">Class 11 Study Notes</h2>

    <div class="grid-container">
        <a href="physics-notes.html" class="folder-card">📁 Physics</a>
        <a href="chemistry-notes.html" class="folder-card">📁 Chemistry</a>
        <a href="maths-notes.html" class="folder-card">📁 Mathematics</a>
        <a href="english-notes.html" class="folder-card">📁 English</a>
        <a href="cs-notes.html" class="folder-card">📁 Computer Science</a>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>
</body>
</html>
