<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Books | Swastik-Tech</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9509706674270233" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.9);
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow-green: rgba(16, 185, 129, 0.3);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-green: #059669;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-glow-green: rgba(5, 150, 105, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-glow-green);
            margin-bottom: 2rem;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-green);
            border-left: 3px solid var(--accent-green);
            padding-left: 10px;
            text-decoration: none;
        }

        .top-nav-right { display: flex; gap: 1rem; align-items: center; }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-glow-green);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover { box-shadow: 0 0 10px var(--border-glow-green); }

        .pdf-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .pdf-item {
            background: var(--card-bg);
            border: 1px solid var(--border-glow-green);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .pdf-item:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px var(--border-glow-green);
            transform: translateX(4px);
        }

        .pdf-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            font-weight: 600;
        }

        .pdf-info i {
            font-size: 1.4rem;
            color: var(--accent-green);
        }

        .download-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header>
        <a href="books.html" class="header-title">| Physics Reference Library</a>
        <div class="top-nav-right">
            <button onclick="toggleTheme()" class="nav-btn"><i class="fa-solid fa-circle-half-stroke"></i> Theme</button>
            <a href="books.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Books Hub</a>
        </div>
    </header>

    <main>
        <div class="pdf-list">
            <!-- Points to books-pdf/Physics/ -->
            <a href="books-pdf/Physics/mechanics-module.pdf" class="pdf-item" target="_blank">
                <div class="pdf-info">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Mechanics & Kinematics Module</span>
                </div>
                <div class="download-tag">PDF <i class="fa-solid fa-download"></i></div>
            </a>

            <a href="books-pdf/Physics/thermodynamics.pdf" class="pdf-item" target="_blank">
                <div class="pdf-info">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Thermodynamics & Waves Handbook</span>
                </div>
                <div class="download-tag">PDF <i class="fa-solid fa-download"></i></div>
            </a>

            <a href="books-pdf/Physics/physics-question-bank.pdf" class="pdf-item" target="_blank">
                <div class="pdf-info">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Class 11 Physics Question Bank</span>
                </div>
                <div class="download-tag">PDF <i class="fa-solid fa-download"></i></div>
            </a>
        </div>
    </main>

    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</body>
</html>
