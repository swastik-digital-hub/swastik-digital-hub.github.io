<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Python IDE | Swastik-Tech</title>
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9509706674270233" crossorigin="anonymous"></script>

    <!-- Pyodide WebAssembly for In-Browser Python -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2300f3ff%22><path d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22/></svg>">

    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow-green: rgba(16, 185, 129, 0.3);
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-green: #059669;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-glow-green: rgba(5, 150, 105, 0.3);
            --grid-color: rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, var(--border-glow-green) 0%, transparent 80%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-glow-green);
            margin-bottom: 1.5rem;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-green);
            border-left: 3px solid var(--accent-green);
            padding-left: 10px;
            text-decoration: none;
        }

        .top-nav-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-glow-green);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover { box-shadow: 0 0 10px var(--border-glow-green); }

        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            height: calc(100vh - 120px);
        }

        .editor-box, .terminal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-glow-green);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(8px);
        }

        .box-header {
            background: rgba(16, 185, 129, 0.1);
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--accent-green);
        }

        .run-btn {
            background: var(--accent-green);
            color: var(--bg-color);
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .run-btn:hover { box-shadow: 0 0 12px var(--accent-green); }

        textarea#code-input {
            flex: 1;
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        #output {
            flex: 1;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #38bdf8;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Swastik AI Floating Button & Panel */
        .ai-fab-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--accent-green);
            color: #080c14;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px var(--border-glow-green);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .ai-fab-btn:hover { transform: scale(1.05); }

        .ai-panel {
            position: fixed;
            bottom: 80px;
            right: 25px;
            width: 360px;
            height: 490px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .ai-panel.hidden { display: none; }

        .ai-header {
            background: rgba(16, 185, 129, 0.15);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow-green);
            color: var(--accent-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }

        .ai-close-btn {
            background: transparent;
            border: none;
            color: var(--accent-green);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .ai-quick-actions {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-glow-green);
        }

        .ai-quick-actions button {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.2s ease;
        }

        .ai-quick-actions button:hover {
            background: var(--accent-green);
            color: #080c14;
        }

        .ai-chat-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 13.5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ai-msg {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 88%;
            line-height: 1.4;
        }

        .ai-msg.bot {
            background: rgba(16, 185, 129, 0.1);
            border-left: 3px solid var(--accent-green);
            color: #f8fafc;
        }

        .ai-msg.user {
            background: #1e293b;
            align-self: flex-end;
            color: #f8fafc;
        }

        .ai-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid var(--border-glow-green);
        }

        .ai-input-area input {
            flex: 1;
            background: #080c14;
            border: 1px solid var(--border-glow-green);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px 0 0 6px;
            outline: none;
            font-family: 'Rajdhani', sans-serif;
        }

        .ai-input-area button {
            background: var(--accent-green);
            border: none;
            color: #080c14;
            padding: 8px 14px;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .ide-container { grid-template-columns: 1fr; height: auto; }
            .editor-box, .terminal-box { height: 350px; }
            .ai-panel { width: 90%; right: 5%; bottom: 80px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="class11-cs.html" class="header-title">| Python Interactive IDE</a>
        <div class="top-nav-right">
            <button onclick="toggleTheme()" class="nav-btn"><i class="fa-solid fa-circle-half-stroke"></i> Theme</button>
            <a href="class11-cs.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
        </div>
    </header>

    <div class="ide-container">
        <!-- Python Code Editor -->
        <div class="editor-box">
            <div class="box-header">
                <span><i class="fa-solid fa-code"></i> Python Script</span>
                <button class="run-btn" onclick="runPython()"><i class="fa-solid fa-play"></i> Run Code</button>
            </div>
            <textarea id="code-input" placeholder="# Write Python code here...&#10;name = input('Enter your name: ')&#10;print(f'Hello, {name}! Welcome to Swastik-Tech IDE.')"></textarea>
        </div>

        <!-- Terminal / Execution Output -->
        <div class="terminal-box">
            <div class="box-header">
                <span><i class="fa-solid fa-terminal"></i> Terminal Output</span>
                <button class="nav-btn" onclick="clearOutput()" style="padding: 2px 8px; font-size: 0.75rem;"><i class="fa-solid fa-trash"></i> Clear</button>
            </div>
            <div id="output">Loading Python Engine (Pyodide)... Please wait.</div>
        </div>
    </div>

    <!-- Swastik AI Floating Toggle Button -->
    <button id="ai-toggle-btn" class="ai-fab-btn" onclick="toggleAIChat()">
        <i class="fa-solid fa-robot"></i> Swastik AI
    </button>

    <!-- Swastik AI Sidebar Panel -->
    <div id="swastik-ai-panel" class="ai-panel hidden">
        <div class="ai-header">
            <div class="ai-title"><i class="fa-solid fa-brain"></i> Swastik AI Assistant</div>
            <button onclick="toggleAIChat()" class="ai-close-btn">&times;</button>
        </div>
        
        <div class="ai-quick-actions">
            <button onclick="quickAction('explain')">💡 Explain Code</button>
            <button onclick="quickAction('debug')">🐞 Debug Code</button>
        </div>

        <div id="ai-messages" class="ai-chat-body">
            <div class="ai-msg bot">
                Hello! I am <strong>Swastik AI</strong>. Ask me any Python doubt, paste an error message, or click "Debug Code" to check your current script!
            </div>
        </div>

        <div class="ai-input-area">
            <input type="text" id="ai-user-input" placeholder="Ask a question or paste error..." onkeypress="handleKeyPress(event)">
            <button onclick="sendToAI()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        let pyodideInstance = null;

        // Synchronous input handler to prevent PyodideFuture errors during int() conversion
        function syncInput(promptText) {
            let userVal = window.prompt(promptText || "Input requested:");
            return userVal !== null ? userVal : "";
        }

        async function initPyodide() {
            const outputDiv = document.getElementById('output');
            try {
                pyodideInstance = await loadPyodide();
                pyodideInstance.globals.set("custom_input", syncInput);
                pyodideInstance.runPython(`
                    import sys
                    def input(prompt=""):
                        return custom_input(prompt)
                `);
                outputDiv.innerText = "Python 3.11 (Pyodide) Ready!\nClick 'Run Code' to execute your script.\n";
            } catch (err) {
                outputDiv.innerText = "Error loading Pyodide Engine: " + err;
            }
        }
        initPyodide();

        async function runPython() {
            const outputDiv = document.getElementById('output');
            const code = document.getElementById('code-input').value;

            if (!pyodideInstance) {
                outputDiv.innerText = "Pyodide is still initializing. Please wait a few seconds...";
                return;
            }

            outputDiv.innerText = "Running script...\n\n";

            try {
                pyodideInstance.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);

                await pyodideInstance.runPythonAsync(code);

                let stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
                outputDiv.innerText += stdout || "[Program executed successfully with no output.]";
            } catch (err) {
                outputDiv.innerText += "Execution Error:\n" + err;
            }
        }

        function clearOutput() {
            document.getElementById('output').innerText = "";
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // --- SWASTIK AI INTEGRATION LOGIC ---
        function toggleAIChat() {
            document.getElementById('swastik-ai-panel').classList.toggle('hidden');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendToAI();
        }

        async function fetchAIResponse(promptText) {
            const chatBody = document.getElementById('ai-messages');
            
            // Append User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'ai-msg user';
            userDiv.innerText = promptText;
            chatBody.appendChild(userDiv);

            // Append Bot Loading Message
            const botDiv = document.createElement('div');
            botDiv.className = 'ai-msg bot';
            botDiv.innerText = "Swastik AI is analyzing...";
            chatBody.appendChild(botDiv);
            chatBody.scrollTop = chatBody.scrollHeight;

            // ⚠️ PASTE YOUR GEMINI API KEY INSIDE THE QUOTES BELOW ⚠️
            const apiKey = "YOUR_GEMINI_API_KEY_HERE"; 

            if (apiKey === "YOUR_GEMINI_API_KEY_HERE") {
                botDiv.innerText = "Please replace 'YOUR_GEMINI_API_KEY_HERE' with your actual Gemini API key to activate Swastik AI!";
                return;
            }

            try {
                const systemPrompt = "You are Swastik AI, a friendly Class 11 Computer Science Python tutor. Provide brief, encouraging, and accurate Python guidance suited for a high school student.";
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `${systemPrompt}\n\nStudent Query:${promptText}` }]
                        }]
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                botDiv.innerText = reply;
            } catch (err) {
                botDiv.innerText = "Sorry, I couldn't reach the AI server right now. Please try again in a moment.";
            }
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function sendToAI() {
            const input = document.getElementById('ai-user-input');
            const query = input.value.trim();
            if (!query) return;
            input.value = '';
            fetchAIResponse(query);
        }

        function quickAction(type) {
            const currentCode = document.getElementById('code-input').value;
            if (!currentCode.trim()) {
                alert("Please enter some Python code in the editor first!");
                return;
            }
            if (type === 'explain') {
                fetchAIResponse(`Explain this Python code line-by-line:\n\n\`\`\`python\n${currentCode}\n\`\`\``);
            } else if (type === 'debug') {
                fetchAIResponse(`Debug this Python code, point out any logical or syntax errors, and provide the corrected version:\n\n\`\`\`python\n${currentCode}\n\`\`\``);
            }
        }
    </script>
</body>
</html>
