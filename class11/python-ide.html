<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python IDE | Swastik-Tech</title>
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9509706674270233" crossorigin="anonymous"></script>

    <!-- Pyodide for running Python in browser -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2300f3ff%22><path d=%22M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5%22/></svg>">

    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.9);
            --accent-green: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow-green: rgba(16, 185, 129, 0.3);
            --code-bg: #0f172a;
            --output-bg: #020617;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-green: #059669;
            --accent-hover: #047857;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-glow-green: rgba(5, 150, 105, 0.3);
            --code-bg: #ffffff;
            --output-bg: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            transition: background-color 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-glow-green);
            margin-bottom: 1.5rem;
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-green);
            border-left: 3px solid var(--accent-green);
            padding-left: 10px;
            text-decoration: none;
        }

        .top-nav-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-glow-green);
            color: var(--accent-green);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            box-shadow: 0 0 10px var(--border-glow-green);
        }

        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex-grow: 1;
        }

        @media (max-width: 900px) {
            .ide-container {
                grid-template-columns: 1fr;
            }
        }

        .pane {
            background: var(--card-bg);
            border: 1px solid var(--border-glow-green);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .pane-header {
            background: rgba(16, 185, 129, 0.1);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glow-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--accent-green);
        }

        .run-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .run-btn:hover {
            background: var(--accent-hover);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-green);
        }

        textarea {
            flex-grow: 1;
            background: var(--code-bg);
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            padding: 15px;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.5;
            tab-size: 4;
        }

        /* Console Output Container */
        .terminal-screen {
            flex-grow: 1;
            background: var(--output-bg);
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            padding: 15px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            display: flex;
            flex-direction: column;
            min-height: 250px;
            cursor: text;
        }

        #terminalOutput {
            flex-grow: 1;
        }

        .active-input-row {
            display: inline-flex;
            align-items: center;
            width: 100%;
        }

        .inline-input {
            background: transparent;
            border: none;
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            outline: none;
            flex-grow: 1;
            caret-color: #38bdf8;
        }

        .status-bar {
            padding: 6px 15px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.2);
            color: var(--text-muted);
            border-top: 1px solid var(--border-glow-green);
        }
    </style>
</head>
<body>

    <header>
        <a href="class11-cs.html" class="header-title">| Swastik-Tech Python IDE</a>
        <div class="top-nav-right">
            <button onclick="toggleTheme()" class="nav-btn"><i class="fa-solid fa-circle-half-stroke"></i> Theme</button>
            <a href="class11-cs.html" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> CS Hub</a>
        </div>
    </header>

    <div class="ide-container">
        <!-- Editor Pane -->
        <div class="pane">
            <div class="pane-header">
                <span><i class="fa-solid fa-code"></i> main.py</span>
                <button onclick="runPythonCode()" id="runBtn" class="run-btn" disabled>
                    <i class="fa-solid fa-play"></i> Loading Python...
                </button>
            </div>
            <textarea id="codeEditor" placeholder="# Write your Python code here...">n = int(input("Enter a number : "))
s = 0
l = 0
for a in range(n):
    x = n % 10
    if x > l:
        s = l
        l = x
    elif x > s and x != l:
        s = x
    n = n // 10
print("Second largest digit is:", s)</textarea>
            <div class="status-bar" id="engineStatus">Initializing Pyodide WebAssembly Engine...</div>
        </div>

        <!-- Output Pane -->
        <div class="pane">
            <div class="pane-header">
                <span><i class="fa-solid fa-terminal"></i> Output</span>
                <button onclick="clearTerminal()" class="nav-btn" style="padding: 3px 8px; font-size: 0.75rem;">Clear</button>
            </div>
            <div class="terminal-screen" id="terminalScreen" onclick="focusActiveInput()">
                <div id="terminalOutput">Terminal ready. Click 'Run' to execute code...</div>
            </div>
            <div class="status-bar">Status: Ready</div>
        </div>
    </div>

    <script>
        let pyodideReady = false;
        let pyodide = null;

        async function initPyodide() {
            const statusElem = document.getElementById('engineStatus');
            const runBtn = document.getElementById('runBtn');
            try {
                pyodide = await loadPyodide();
                pyodideReady = true;
                statusElem.innerText = "Python Engine Ready";
                runBtn.disabled = false;
                runBtn.innerHTML = '<i class="fa-solid fa-play"></i> Run';
            } catch (error) {
                statusElem.innerText = "Failed to load Python engine.";
                console.error(error);
            }
        }
        initPyodide();

        function appendText(text) {
            const out = document.getElementById('terminalOutput');
            out.innerText += text;
            scrollToBottom();
        }

        function scrollToBottom() {
            const screen = document.getElementById('terminalScreen');
            screen.scrollTop = screen.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminalOutput').innerText = "";
        }

        function focusActiveInput() {
            const activeInput = document.getElementById('currentInput');
            if (activeInput) {
                activeInput.focus();
            }
        }

        // Custom inline input handler matching standard terminal behavior
        async function terminalInput(promptText = "") {
            if (promptText) {
                appendText(promptText);
            }

            return new Promise((resolve) => {
                const out = document.getElementById('terminalOutput');
                
                // Create inline input row
                const row = document.createElement('div');
                row.className = 'active-input-row';

                const inputElem = document.createElement('input');
                inputElem.type = 'text';
                inputElem.id = 'currentInput';
                inputElem.className = 'inline-input';
                inputElem.autocomplete = 'off';

                row.appendChild(inputElem);
                out.appendChild(row);
                scrollToBottom();
                inputElem.focus();

                inputElem.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const val = inputElem.value;
                        // Lock input and convert to static text
                        row.remove();
                        appendText(val + "\n");
                        resolve(val);
                    }
                });
            });
        }

        async function runPythonCode() {
            if (!pyodideReady) {
                alert("Python engine is still loading. Please wait a second!");
                return;
            }

            const code = document.getElementById('codeEditor').value;
            clearTerminal();

            // Redirect Python stdout to our terminal screen
            pyodide.setStdout({
                batched: (msg) => {
                    appendText(msg + "\n");
                }
            });

            // Bind python's input() function to our inline terminal handler
            pyodide.globals.set("input", terminalInput);

            try {
                await pyodide.runPythonAsync(code);
            } catch (err) {
                appendText("\n[Error]: " + err.message + "\n");
            }
        }

        // Theme Support
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</body>
</html>
