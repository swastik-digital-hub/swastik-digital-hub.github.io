<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 11 Physics Hub | Swastik-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-cyan: #00f3ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 243, 255, 0.3);
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-cyan: #0284c7;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-glow: rgba(2, 132, 199, 0.3);
            --grid-color: rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, var(--border-glow) 0%, transparent 80%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 2rem;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 2rem;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--accent-cyan);
            text-decoration: none;
        }

        .back-nav {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .back-nav:hover { opacity: 0.8; }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            margin: 1rem 0 2rem 0;
            border-left: 4px solid var(--accent-cyan);
            padding-left: 0.8rem;
        }

        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .pdf-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .pdf-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--border-glow);
        }

        .pdf-icon {
            font-size: 2.2rem;
            color: #ff6b6b;
        }

        .pdf-info h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 0.3rem;
            color: var(--text-main);
        }

        .pdf-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <a href="../index.html" class="brand-title">Swastik-Tech</a>
        </div>
        <a href="class11-hub.html" class="back-nav">&larr; Back to Science Portal</a>
    </header>

    <h2 class="section-title">| Class 11 Physics Question Banks</h2>

    <div class="pdf-grid">
        <a href="file:///C:/Users/LENOVO/OneDrive/Desktop/02.%20Scalar%20&%20Vector%20(Q).pdf" class="pdf-card" target="_blank">
            <i class="fa-solid fa-file-pdf pdf-icon"></i>
            <div class="pdf-info">
                <h3>Scalar & Vector</h3>
                <p>Practice Question Bank (PDF)</p>
            </div>
        </a>

        <a href="file:///C:/Users/LENOVO/OneDrive/Desktop/04.%20Projectile%20%20(Q).pdf" class="pdf-card" target="_blank">
            <i class="fa-solid fa-file-pdf pdf-icon"></i>
            <div class="pdf-info">
                <h3>Projectile Motion</h3>
                <p>Practice Question Bank (PDF)</p>
            </div>
        </a>

        <a href="file:///C:/Users/LENOVO/OneDrive/Desktop/05.%20Laws%20of%20motion%20and%20Friction%20%20(Q).pdf" class="pdf-card" target="_blank">
            <i class="fa-solid fa-file-pdf pdf-icon"></i>
            <div class="pdf-info">
                <h3>Laws of Motion & Friction</h3>
                <p>Practice Question Bank (PDF)</p>
            </div>
        </a>

        <a href="file:///C:/Users/LENOVO/OneDrive/Desktop/06.%20Work,%20Energy%20and%20Power%20(Q).pdf" class="pdf-card" target="_blank">
            <i class="fa-solid fa-file-pdf pdf-icon"></i>
            <div class="pdf-info">
                <h3>Work, Energy and Power</h3>
                <p>Practice Question Bank (PDF)</p>
            </div>
        </a>
    </div>

    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>
</body>
</html>
