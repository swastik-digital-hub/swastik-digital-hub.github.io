<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 11 Mathematics Notes | Swastik-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #03151c;
            --card-bg: rgba(6, 32, 43, 0.85);
            --card-border: #0e3746;
            --accent-cyan: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #83c5be;
            --border-glow: rgba(0, 243, 255, 0.25);
            --grid-color: rgba(0, 243, 255, 0.04);
            --input-bg: rgba(0, 243, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 180, 216, 0.12) 0%, transparent 70%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
            padding-left: 10px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-cyan);
        }

        .section-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .pdf-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.2rem;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            transition: all 0.3s ease;
        }

        .pdf-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--border-glow);
        }

        .pdf-card-top {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .pdf-icon {
            font-size: 2.2rem;
            color: #ff4d4d;
        }

        .pdf-info h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .pdf-info p {
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .pdf-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--accent-cyan);
            padding: 0.5rem;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: var(--input-bg);
            box-shadow: 0 0 10px var(--border-glow);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">| Class 11 Mathematics Notes</div>
        <a href="notes.html" class="back-link">← Back to Sections</a>
    </div>

    <div class="section-header">Available Study Notes</div>

    <div class="pdf-card">
        <div class="pdf-card-top">
            <i class="fa-solid fa-file-pdf pdf-icon"></i>
            <div class="pdf-info">
                <h3>Sets</h3>
                <p>Mathematics Comprehensive Revision Notes (2026)</p>
            </div>
        </div>
        <div class="pdf-actions">
            <a href="https://swastik-digital-hub.github.io/class11/class11-notes/pdfs/Maths/Sets.pdf" target="_blank" class="btn-action">
                <i class="fa-solid fa-eye"></i> View
            </a>
            <a href="https://swastik-digital-hub.github.io/class11/class11-notes/pdfs/Maths/Sets.pdf" download="Sets.pdf" class="btn-action">
                <i class="fa-solid fa-download"></i> Download
            </a>
        </div>
    </div>

</body>
</html>
