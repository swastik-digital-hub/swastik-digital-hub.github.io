<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 11 Notes Portal | Swastik-Tech</title>
    
    <!-- Browser Tab Favicon Logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">

    <!-- Google AdSense Main Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9509706674270233" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #03151c;
            --card-bg: rgba(6, 32, 43, 0.85);
            --card-border: #0e3746;
            --accent-cyan: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #83c5be;
            --border-glow: rgba(0, 243, 255, 0.25);
            --grid-color: rgba(0, 243, 255, 0.04);
            --input-bg: rgba(0, 243, 255, 0.04);
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #cbd5e1;
            --accent-cyan: #059669;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-glow: rgba(5, 150, 105, 0.25);
            --grid-color: rgba(0, 0, 0, 0.03);
            --input-bg: #e6fffa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 180, 216, 0.12) 0%, transparent 70%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
            padding-left: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-btn {
            background: var(--card-bg);
            color: var(--accent-cyan);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            color: var(--accent-cyan);
        }

        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .folders-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 600px;
        }

        .folder-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .folder-card:hover {
            border-color: var(--accent-cyan);
            background: var(--input-bg);
            box-shadow: 0 0 15px var(--border-glow);
            transform: translateY(-2px);
        }

        .folder-card i {
            color: var(--accent-cyan);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">
            <i class="fa-solid fa-graduation-cap"></i> Class 11 Notes Portal
        </div>
        <div class="top-nav-right">
            <button class="theme-btn" onclick="toggleTheme()">
                <i class="fa-solid fa-circle-half-stroke"></i> Theme
            </button>
            <a href="../class11-hub.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Hub
            </a>
        </div>
    </div>

    <div class="section-label">Available Subject Sections</div>

    <div class="folders-container">
        <a href="physics-notes.html" class="folder-card">
            <i class="fa-solid fa-folder"></i> Physics
        </a>
        <a href="chemistry-notes.html" class="folder-card">
            <i class="fa-solid fa-folder"></i> Chemistry
        </a>
        <a href="maths-notes.html" class="folder-card">
            <i class="fa-solid fa-folder"></i> Mathematics
        </a>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                localStorage.setItem('portal-theme', 'light');
            } else {
                localStorage.setItem('portal-theme', 'dark');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('portal-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        });
    </script>
</body>
</html>
