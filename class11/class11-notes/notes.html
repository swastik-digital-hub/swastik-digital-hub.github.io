<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 11 Notes Hub | Swastik-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #03151c;
            --card-bg: rgba(6, 32, 43, 0.85);
            --card-border: #0e3746;
            --accent-cyan: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #83c5be;
            --border-glow: rgba(0, 243, 255, 0.25);
            --grid-color: rgba(0, 243, 255, 0.04);
            --input-bg: rgba(0, 243, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 180, 216, 0.12) 0%, transparent 70%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
            padding-left: 10px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-cyan);
        }

        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .folders-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 600px;
        }

        .folder-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95srem;
            transition: all 0.3s ease;
        }

        .folder-card:hover {
            border-color: var(--accent-cyan);
            background: var(--input-bg);
            box-shadow: 0 0 15px var(--border-glow);
            transform: translateY(-2px);
        }

        .folder-card i {
            color: var(--accent-cyan);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand">| Class 11 Notes Hub</div>
        <a href="class11-hub.html" class="back-link">← Back to Hub</a>
    </div>

    <div class="section-label">Select Subject Section</div>

    <div class="folders-container">
        <a href="class11-physics-notes.html" class="folder-card">
            <i class="fa-solid fa-folder"></i> Physics
        </a>
        <a href="class11-chemistry-notes.html" class="folder-card">
            <i class="fa-solid fa-folder"></i> Chemistry
        </a>
        <a href="class11-maths-notes.html" class="folder-card">
            <i class="fa-solid fa-folder"></i> Mathematics
        </a>
    </div>

</body>
</html>
